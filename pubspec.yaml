

name: myapp
description: "Track your office attendance and work-from-home days effortlessly with AreUWFO."
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.4.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^4.4.0
  firebase_analytics: ^12.1.1
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  provider: ^6.1.2
  google_fonts: ^6.3.3
  go_router: ^12.1.3
  intl: ^0.19.0
  shared_preferences: ^2.5.4
  fluttertoast: ^8.2.14
  firebase_crashlytics: ^5.0.7
  csv: ^6.0.0
  lottie: ^3.3.2
  package_info_plus: ^8.3.0
  share_plus: ^7.2.2
  path_provider: ^2.1.5
  google_mobile_ads: ^7.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.5.0

flutter:
  uses-material-design: true
  assets:
    - assets/lottie/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
